mode: rule
log-level: info
allow-lan: false
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
  - 1.1.1.1
  - 8.8.8.8
proxies:
- type: vless
  uuid: ad4492d1-6858-4841-bd50-1dff56dedcb7
  name: EPODONIOS
  server: 172.232.250.227
  port: 443
  udp: true
  network: ws
  tls: true
  servername: id-full.privateip.net
  ws-opts:
    path: /VLESS
proxy-groups:
- name: AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  proxies:
  - EPODONIOS
- name: SELECT
  type: select
  proxies:
  - AUTO
  - EPODONIOS
rules:
- MATCH,SELECT
