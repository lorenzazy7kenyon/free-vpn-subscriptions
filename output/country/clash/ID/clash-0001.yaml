  enhanced-mode: fake-ip
  nameserver:
  - 1.1.1.1
  - 8.8.8.8
proxies:
- type: vless
  uuid: 7d9dbe01-f192-436e-b6d5-533fc3c998e0
  name: EPODONIOS
  server: 103.150.192.28
  port: 443
  udp: true
  network: ws
  tls: true
  servername: nova-relay-d9g973.pages.dev
  client-fingerprint: chrome
  ws-opts:
    path: /ws?ip=103.150.192.28:443
