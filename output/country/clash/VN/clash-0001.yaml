  enhanced-mode: fake-ip
  nameserver:
  - 1.1.1.1
  - 8.8.8.8
proxies:
- type: vless
  uuid: 495c7195-85b8-498a-bf20-2ea9ce9175b5
  name: '🇸🇬 新加坡 | SGP #5'
  server: 103.161.179.36
  port: 443
  udp: true
  network: ws
  tls: true
  servername: snip.edgeoneai.cc.cd
  ws-opts:
    path: /fp=chromefp=chrome
    headers:
      Host: snip.edgeoneai.cc.cd
- type: vless
  uuid: 495c7195-85b8-498a-bf20-2ea9ce9175b5
  name: 🇸🇬 新加坡 | SGP
  server: 103.161.179.36
  port: 443
  udp: true
  network: ws
  tls: true
  servername: snip.edgeoneai.cc.cd
  client-fingerprint: chrome
