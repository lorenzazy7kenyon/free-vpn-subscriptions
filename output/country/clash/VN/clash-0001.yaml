  proxies:
  - '🇸🇬 新加坡 | SGP #4'
  - '🇭🇰 香港 | HKG #4'
- name: SELECT
  type: select
  proxies:
  - AUTO
  - '🇸🇬 新加坡 | SGP #4'
  - '🇭🇰 香港 | HKG #4'
rules:
- MATCH,SELECT
