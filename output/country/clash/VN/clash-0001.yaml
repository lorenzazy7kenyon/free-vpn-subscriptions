mode: rule
log-level: info
allow-lan: false
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
  - 1.1.1.1
  - 8.8.8.8
proxies:
- type: vless
  uuid: 495c7195-85b8-498a-bf20-2ea9ce9175b5
  name: '🇸🇬 新加坡 | SGP #4'
  server: 103.161.178.72
  port: 443
  udp: true
  network: ws
  tls: true
  servername: snip.edgeoneai.cc.cd
  ws-opts:
    path: /fp=chrome
    headers:
      Host: snip.edgeoneai.cc.cd
- type: vless
  uuid: 495c7195-85b8-498a-bf20-2ea9ce9175b5
  name: '🇭🇰 香港 | HKG #4'
  server: 103.199.18.84
  port: 443
  udp: true
  network: ws
  tls: true
  servername: snip.edgeoneai.cc.cd
  ws-opts:
    path: /fp=chrome
    headers:
      Host: snip.edgeoneai.cc.cd
proxy-groups:
- name: AUTO
  type: url-test
