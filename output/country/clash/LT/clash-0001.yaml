  interval: 300
  proxies:
  - '🏳[www.v2nodes.com] vless- #10'
- name: SELECT
  type: select
  proxies:
  - AUTO
  - '🏳[www.v2nodes.com] vless- #10'
rules:
- MATCH,SELECT
