  enhanced-mode: fake-ip
  nameserver:
  - 1.1.1.1
  - 8.8.8.8
proxies:
- type: vless
  uuid: d342d11e-d224-4463-b982-532309285094
  name: '🏳[www.v2nodes.com] vless- #10'
  server: 88.216.69.253
  port: 443
  udp: true
  network: ws
  tls: true
  servername: ccc.010304.xyz
  ws-opts:
    path: /fp=chromefp=unsafe
    headers:
      Host: ccc.010304.xyz
proxy-groups:
- name: AUTO
  type: url-test
