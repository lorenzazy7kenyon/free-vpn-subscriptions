  enhanced-mode: fake-ip
  nameserver:
  - 1.1.1.1
  - 8.8.8.8
proxies:
- type: vless
  uuid: 83706ae4-be2f-4b2b-8079-c3eb4e0b2e3e
  name: '🇩🇪[www.v2nodes.com] vless-DE-1... #2'
  server: 188.214.37.231
  port: 443
  udp: true
  network: ws
  tls: true
  servername: lagoon.gerqix.online
  ws-opts:
    path: /api/de5/streamfp=firefox
    headers:
      Host: lagoon.gerqix.online
proxy-groups:
- name: AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  proxies:
  - '🇩🇪[www.v2nodes.com] vless-DE-1... #2'
- name: SELECT
  type: select
  proxies:
  - AUTO
  - '🇩🇪[www.v2nodes.com] vless-DE-1... #2'
rules:
- MATCH,SELECT
