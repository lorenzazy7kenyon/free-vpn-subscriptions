mode: rule
log-level: info
allow-lan: false
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
  - 1.1.1.1
  - 8.8.8.8
proxies:
- type: vless
  uuid: 7967bf59-57e3-4cde-9898-527b0fe60022
  name: EPODONIOS
  server: 45.131.7.7
  port: 8443
  udp: true
  network: ws
  tls: true
  servername: speed.dulacloud.store
  ws-opts:
    path: /dula?Telegram-WangCai2
    headers:
      Host: speed.dulacloud.store
proxy-groups:
- name: AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  proxies:
  - EPODONIOS
- name: SELECT
  type: select
  proxies:
  - AUTO
  - EPODONIOS
rules:
- MATCH,SELECT
