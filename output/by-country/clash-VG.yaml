mode: rule
log-level: info
allow-lan: false
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
  - 1.1.1.1
  - 8.8.8.8
proxies:
- type: vless
  uuid: 6202b230-417c-4d8e-b624-0f71afa9c75d
  name: EPODONIOS
  server: 45.142.120.30
  port: 8880
  udp: true
  network: ws
  ws-opts:
    path: /
    headers:
      Host: vms.lifetime08.workers.dev
proxy-groups:
- name: AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  proxies:
  - EPODONIOS
- name: SELECT
  type: select
  proxies:
  - AUTO
  - EPODONIOS
rules:
- MATCH,SELECT
