mode: rule
log-level: info
allow-lan: false
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
  - 1.1.1.1
  - 8.8.8.8
proxies:
- type: vless
  uuid: 40af9131-d540-448a-bc56-5bba147a1dc3
  name: EPODONIOS
  server: 154.218.15.250
  port: 2083
  udp: true
  network: ws
  tls: true
  servername: proxy-1cu.pages.dev
  ws-opts:
    path: /
    headers:
      Host: proxy-1cu.pages.dev
proxy-groups:
- name: AUTO
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  proxies:
  - EPODONIOS
- name: SELECT
  type: select
  proxies:
  - AUTO
  - EPODONIOS
rules:
- MATCH,SELECT
